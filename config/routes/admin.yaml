akawaka_sylius_security_admin_admin_user_request_password_reset:
    path: /users/{id}/request-password-reset
    methods: [POST]
    requirements:
        id: \d+
    defaults:
        _controller: akawaka_sylius_security.controller.request_admin_user_password_reset

akawaka_sylius_security_admin_admin_action_log:
    resource: |
        alias: akawaka_sylius_security.admin_action_log
        section: admin
        path: admin-action-logs
        templates: "@SyliusAdmin\\Crud"
        only: ['index']
        grid: akawaka_sylius_security_admin_admin_action_log
        permission: true
        vars:
            index:
                icon: history
                header: akawaka_sylius_security.ui.admin_action_logs
                subheader: akawaka_sylius_security.ui.admin_action_log.subheader
    type: sylius.resource

akawaka_sylius_security_admin_admin_action_log_show:
    path: /admin-action-logs/{id}
    methods: [GET]
    requirements:
        id: \d+
    defaults:
        _controller: akawaka_sylius_security.controller.admin_action_log::showAction
        _sylius:
            section: admin
            permission: true
            template: '@AkawakaSyliusSecurityPlugin/Admin/AdminActionLog/show.html.twig'
