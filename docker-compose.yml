services:
    mysql:
        image: mysql:8.0
        platform: linux/amd64
        environment:
            MYSQL_ROOT_PASSWORD: mysql
        ports:
            - ${MYSQL_PORT:-3306}:3306
        networks:
            - sylius

    mailhog:
        image: mailhog/mailhog:latest
        environment:
            - MH_STORAGE=maildir
        ports:
            - ${MAILHOG_PORT:-8025}:8025
            - 1025:1025
        networks:
            - sylius

networks:
    sylius:
        driver: bridge
